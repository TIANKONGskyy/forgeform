name: pages

# 把 docs/showcase 发布成静态站点，让别人不用 clone 就能看作品页。
# 启用方法：仓库 Settings → Pages → Source 选 "GitHub Actions"。

on:
  push:
    branches: [main, master]
    paths:
      - "docs/showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/showcase

      - id: deployment
        uses: actions/deploy-pages@v4
