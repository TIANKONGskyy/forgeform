name: Bug 报告
description: 出图/建模/导出跑不通，或者结果明显不对
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先跑一遍 `python tools/doctor.py`，把它最后一屏贴上来 —— 一半的问题它就能定位。
        提交前请确认已经搜过现有 issue。

  - type: textarea
    id: what
    attributes:
      label: 你做了什么
      description: 具体到动作。比如"在对话里说『做一个手机支架』，点生成图片"
      placeholder: |
        1. 输入「...」
        2. 点「🎨 生成图片」
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么
      description: 有报错就把完整 traceback 贴上（不要截断）
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: tools/doctor.py 的输出
      description: 尽量贴完整
      render: text
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: 显卡与显存
      placeholder: 例如 Tesla V100 32G / RTX 4090 24G / 无 GPU
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统与 Python 版本
      placeholder: 例如 Windows 11 / Python 3.11.15
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 哪一步出问题
      multiple: true
      options:
        - 安装 / 启动
        - 对话（agent 没听懂 / 回话不对）
        - 出图
        - 建模（3D）
        - 导出 STL / 水密
        - 视频
        - 打印（Bambu）
        - Web 界面 / 按钮
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: "`logs/` 下的文件，或者 ComfyUI 那边的 stderr"
      render: text
    validations:
      required: false
