name: 问题上报 / Bug report
description: 跑不起来、结果不对、界面报错——用这个模板
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先用一行命令生成诊断包，比手打十行环境信息管用：

        ```powershell
        python tools/report.py
        ```

        它会在 `outputs/reports/` 下生成 `forgeform-report-<时间>.zip`，
        **已自动脱敏**（key/token/密码打码，家目录路径换成 `~`）。
        发之前可以先解压自己看一眼。

  - type: dropdown
    id: area
    attributes:
      label: 哪一步出问题
      options:
        - 安装 / 启动
        - 对话（需求理解）
        - 出图
        - 建模（单图 / 多视图）
        - 贴图
        - 骨骼绑定
        - 动画
        - 精修
        - 导出 STL / 打印
        - 界面显示
        - 其他
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 你做了什么，看到了什么
      description: 期望结果 vs 实际结果。有报错就把最后 20 行贴上来。
      placeholder: |
        我点了「生成 3D」，等了两分钟，界面一直显示"正在处理…"，日志里最后一行是 ...
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境（诊断包里的 environment.json 前三行贴这里）
      placeholder: |
        platform: Windows-10-10.0.19045-SP0
        python: 3.11.15
        nvidia_smi: NVIDIA GeForce RTX 3060, 12288 MiB, 551.23
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我跑过 `python tools/doctor.py`，并已按提示修复
        - label: 我附上了诊断包（zip）
        - label: 这不是密钥泄露类问题（如果是，请不要贴任何 key，只贴报错）
